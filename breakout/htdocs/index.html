<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>آجرشکن — Breakout</title>
<style>
  :root{
    --bg:#070a14; --panel:#0d1426; --panel2:#121c33; --line:#22345c;
    --accent:#ffd166; --cyan:#4cc9f0; --magenta:#ff5d8f; --green:#06d6a0;
    --text:#e9efff; --muted:#8ba0c9;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:
      radial-gradient(1200px 700px at 70% -10%, #16223f 0%, transparent 60%),
      radial-gradient(900px 600px at 10% 110%, #1a1030 0%, transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:"Vazirmatn","Segoe UI",Tahoma,"Iranian Sans",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    position:fixed; inset:0;              /* kill iOS rubber-banding */
    overscroll-behavior:none;
    touch-action:none;                    /* no pull-to-refresh / pinch-zoom */
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #app{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:12px;}
  @media (max-width:640px){ #app{padding:6px} }
  @media (pointer:coarse){
    #app{padding:0}
    canvas{border-radius:0; box-shadow:none}
  }
  canvas{
    display:block; width:100%; height:100%;
    border-radius:14px;
    box-shadow:0 0 0 1px #1d2c4d, 0 30px 80px -20px rgba(0,0,0,.85), 0 0 120px -40px #4cc9f055;
    background:#070a14;
    touch-action:none; cursor:none;
  }
  canvas.ui-cursor{cursor:default}
  #boot{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--muted); font-size:14px; z-index:5;
  }
  #boot b{color:var(--accent)}
</style>
</head>
<body>
  <div id="app"><canvas id="game" width="960" height="640"></canvas></div>
  <div id="boot">در حال بارگذاری موتور…</div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
