        const src = this.balls.find((b) => b.state === BALL_STATE.FLYING) || this.balls[0];
        const add = Math.min(2, MAX_BALLS - this.balls.length);
        for (let i = 0; i < add; i++) {
          const nb = new Ball(src.x, src.y);
          nb.speed = src.speed;
          nb.state = src.state;
          if (nb.state === BALL_STATE.FLYING) nb.setAngle(src.angle + (i % 2 ? 0.5 : -0.5));
          this.balls.push(nb);
        }
        break;
      }
      case 'laser': this.effects.set('laser', def.dur); this.paddle.laser = true; break;
      case 'sticky': this.effects.set('sticky', def.dur); this.paddle.sticky = true; break;
      case 'shield': this.paddle.shield = true; break;
      case 'life': this.lives = Math.min(6, this.lives + 1); break;
      case 'slow': this.effects.set('slow', def.dur); this.effects.delete('fast'); this.scaleBalls(0.78); break;
      case 'fast': this.effects.set('fast', def.dur); this.effects.delete('slow'); this.scaleBalls(1.28); break;
      case 'slowmo': this.effects.set('slowmo', def.dur); break;
    }
  }

  onEffectEnd(type) {
    switch (type) {
      case 'wide':
      case 'narrow':
        if (!this.effects.has('wide') && !this.effects.has('narrow')) this.paddle.setWidth(PADDLE_BASE_W);
        break;
      case 'laser': this.paddle.laser = false; break;
      case 'sticky': this.paddle.sticky = false; break;
      case 'slow':
      case 'fast':
        if (!this.effects.has('slow') && !this.effects.has('fast')) {
          for (const b of this.balls) b.setSpeed(SPEED_START + Math.min(200, this.elapsed * 4));
        }
        break;
    }
  }

  scaleBalls(k) {
    for (const b of this.balls) b.setSpeed(b.speed * k);
  }

  // ------------------------------------------------------------------ flow
  addScore(pts, x, y, tag) {
    this.score += pts;
    this.floats.spawn(faNum(pts) + (tag ? ' ' + tag : ''), x, y, {
      color: tag ? '#ff5d8f' : '#ffd166',
      size: tag ? 24 : 20,
    });
  }

  loseLife() {
    this.lives--;
    this.audio.sfx('lifeLost');
    this.r.shake(12);
    this.combo = 0;
    this.paddle.setWidth(PADDLE_BASE_W);
    this.effects.clear();
    this.paddle.laser = false;
    this.paddle.sticky = false;
    this.paddle.shield = false;      // the shield is consumed by the miss that cost the life
    this.powerups.length = 0;
    this.bolts.length = 0;
    for (const b of this.balls) b.setSpeed(SPEED_START);

    if (this.lives <= 0) {
      this.state = 'gameOver';
      this.audio.setMusicPattern('menu');
      this.c.events.emit('gameOver', { score: this.score, levelId: this.levelId, stats: this.stats });
      this.banner('باختی!', 2, '#ff5d8f');
      return;
    }
    this.state = 'ready';
    this.banner(`${faNum(this.lives)} جان باقی‌مانده`, 1.4, '#ff5d8f');
    this.newBall();
  }

  completeLevel() {
    this.state = 'levelComplete';
    const timeBonus = Math.max(0, Math.round(3000 - this.elapsed * 12));
    const lifeBonus = this.lives * 300;
    const clearBonus = 500;
    this.bonuses = { timeBonus, lifeBonus, clearBonus };
    this.score += timeBonus + lifeBonus + clearBonus;
    this.audio.sfx('levelWin');
    this.audio.setMusicPattern('menu');
    this.r.shake(6);
    for (let i = 0; i < 5; i++) {
      this.particles.stars(rand.range(FIELD.left, FIELD.right), rand.range(140, 420), 12, i % 2 ? '#4cc9f0' : '#ffd166');
    }
    this.c.events.emit('levelComplete', { score: this.score, levelId: this.levelId, bonuses: this.bonuses });
  }

  // ------------------------------------------------------------------ draw
  draw() {
    const r = this.r;
    this.drawBackground(r);
    this.drawWalls(r);
    for (const b of this.bricks) if (b.alive) b.draw(r, this.time);
    for (const bolt of this.bolts) bolt.draw(r);
    this.paddle.draw(r, this.time);
    for (const pu of this.powerups) pu.draw(r, this.time);
    for (const b of this.balls) b.draw(r, this.time);
    this.particles.draw(r);
    this.floats.draw(r);
    this.drawHUD(r);
    if (this.message) this.drawBanner(r);

    if (this.state === 'paused') this.drawPause(r);
    if (this.state === 'levelComplete') this.drawLevelComplete(r);
    if (this.state === 'gameOver') this.drawGameOver(r);
  }

  drawBackground(r) {
    const { ctx } = r;
    const g = r.gradient(0, 0, 0, 640, [[0, '#0a1128'], [0.6, '#070c1a'], [1, '#0b0716']]);
    r.rect(-20, -20, 1000, 680, g);

    // starfield with slow parallax drift
    ctx.save();
    for (const s of this.bg) {
      const y = (s.y + this.time * s.speed * 12) % 660;
      ctx.globalAlpha = s.a * (0.5 + 0.5 * Math.sin(this.time * 2 + s.ph));
      ctx.fillStyle = s.c;
      ctx.fillRect(s.x, y, s.s, s.s);
    }
    ctx.restore();

    // neon grid
    ctx.save();
    ctx.globalAlpha = 0.07;
    ctx.strokeStyle = '#4cc9f0';
    ctx.lineWidth = 1;
    for (let x = FIELD.left; x <= FIELD.right; x += 32) { ctx.beginPath(); ctx.moveTo(x, FIELD.top); ctx.lineTo(x, FIELD.bottom); ctx.stroke(); }
    for (let y = FIELD.top; y <= FIELD.bottom; y += 32) { ctx.beginPath(); ctx.moveTo(FIELD.left, y); ctx.lineTo(FIELD.right, y); ctx.stroke(); }
    ctx.restore();
  }

  drawWalls(r) {
    const { ctx } = r;
    const t = 10;
    ctx.save();
    ctx.shadowColor = '#4cc9f0';
    ctx.shadowBlur = 14;
    const g = r.gradient(0, FIELD.top, 0, FIELD.bottom, [[0, '#2a4f80'], [1, '#12233f']]);
    r.rect(FIELD.left - t, FIELD.top - t, t, FIELD.bottom - FIELD.top + t, g);
    r.rect(FIELD.right, FIELD.top - t, t, FIELD.bottom - FIELD.top + t, g);
    r.rect(FIELD.left - t, FIELD.top - t, FIELD.right - FIELD.left + t * 2, t, g);
    ctx.restore();

    // danger line at the bottom
    ctx.save();
    ctx.globalAlpha = 0.28 + 0.12 * Math.sin(this.time * 3);
    ctx.strokeStyle = '#ff5d8f';
    ctx.setLineDash([14, 10]);
    ctx.lineWidth = 2;
    ctx.lineDashOffset = this.time * 26;
    ctx.beginPath();
    ctx.moveTo(FIELD.left, FIELD.bottom);
    ctx.lineTo(FIELD.right, FIELD.bottom);
    ctx.stroke();
    ctx.restore();
  }

  drawHUD(r) {
    const { ctx } = r;
    const k = uiScale(r.scale, this.c.coarse);   // legibility on small screens
    r.rect(0, 0, 960, FIELD.top - 6, 'rgba(7,11,24,.82)');
    r.line(0, FIELD.top - 6, 960, FIELD.top - 6, '#1d2c4d', 1);

    // score (right side, RTL)
    r.text('امتیاز', 934, 20, { size: 12 * k, color: '#7f92bb', align: 'right' });
    r.textBold(faNum(this.score), 934, 48, 28 * k, '#ffd166', '#ffb454', 'right');
    const hs = this.c.progress.highScore;
    r.text(`رکورد ${faNum(hs)}`, 934, 70, { size: 11 * k, color: '#5f7199', align: 'right' });

    // level (centre)
    r.text(`مرحله ${faNum(this.levelId)} — ${this.level.name}`, 480, 26, { size: 16 * k, color: '#dbe6ff', weight: '700' });
    const total = this.totalBreakable || 1;
    const done = total - this.remaining;
    const kp = clamp01(done / total);
    r.roundRect(360, 44, 240, 8, 4, '#182342');
    r.roundRect(360, 44, Math.max(6, 240 * kp), 8, 4, r.gradient(360, 0, 600, 0, [[0, '#4cc9f0'], [1, '#06d6a0']]));
    r.text(`${faNum(done)} / ${faNum(total)} آجر`, 480, 68, { size: 11 * k, color: '#8ba0c9' });

    // on-screen pause button for touch devices
    if (this.c.coarse) {
      const b = this.pauseBtn;
      r.roundRect(b.x, b.y, b.w, b.h, 10, 'rgba(27,39,66,.9)', '#2c4270', 1);
      r.rect(b.x + 15, b.y + 13, 5, 20, '#c3d2ee');
      r.rect(b.x + 26, b.y + 13, 5, 20, '#c3d2ee');
    }

    // lives (left)
    r.text('جان', 26, 20, { size: 12 * k, color: '#7f92bb', align: 'left' });
    for (let i = 0; i < this.lives; i++) {
      const x = 34 + i * 26, y = 50;
      ctx.save();
      ctx.fillStyle = '#ff5d8f';
      ctx.shadowColor = '#ff5d8f';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.moveTo(x, y + 7);
      ctx.bezierCurveTo(x - 11, y, x - 6, y - 8, x, y - 2);
      ctx.bezierCurveTo(x + 6, y - 8, x + 11, y, x, y + 7);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // bottom strip: active effects + combo
    r.rect(0, FIELD.bottom + 4, 960, 40, 'rgba(7,11,24,.82)');
    r.line(0, FIELD.bottom + 4, 960, FIELD.bottom + 4, '#1d2c4d', 1);

    let ex = 934;
    for (const [type, t] of this.effects) {
      const def = POWERUPS[type];
      if (!def.dur) continue;
      const w = 118;
      const x = ex - w;
      const ratio = clamp01(t / def.dur);
      r.roundRect(x, FIELD.bottom + 10, w, 28, 8, 'rgba(20,30,54,.9)', def.color + '88', 1);
      drawPowerIcon(r.ctx, def.icon, x + w - 18, FIELD.bottom + 24, def.color);
      r.text(def.label, x + w - 34, FIELD.bottom + 20, { size: 12 * k, color: '#dbe6ff', align: 'right' });
      r.roundRect(x + 8, FIELD.bottom + 30, (w - 44) * ratio, 4, 2, def.color);
      ex -= w + 8;
    }
    if (this.paddle.shield) {
      const w = 96, x = ex - w;
      r.roundRect(x, FIELD.bottom + 10, w, 28, 8, 'rgba(20,30,54,.9)', '#06d6a088', 1);
      drawPowerIcon(r.ctx, 'shield', x + w - 18, FIELD.bottom + 24, '#06d6a0');
      r.text('سپر فعال', x + w - 34, FIELD.bottom + 24, { size: 12, color: '#dbe6ff', align: 'right' });
      ex -= w + 8;
    }

    // combo meter (left of bottom strip)
    if (this.combo > 1) {
      const ratio = clamp01(this.comboTimer / COMBO_WINDOW);
      r.text(`کمبو ${faNum(this.combo)}  ×${faNum(this.multiplier)}`, 26, FIELD.bottom + 18, { size: 15 * k, color: '#ff5d8f', align: 'left', weight: '700' });
      r.roundRect(26, FIELD.bottom + 30, 140, 5, 3, '#182342');
      r.roundRect(26, FIELD.bottom + 30, 140 * ratio, 5, 3, '#ff5d8f');
    } else {
      r.text(`سرعت توپ ${faNum(Math.round(this.balls[0]?.speed ?? 0))}`, 26, FIELD.bottom + 24, { size: 12 * k, color: '#6f82a8', align: 'left' });
    }
    if (this.timeScale < 1) {
      r.text('زمان کند', 480, FIELD.bottom + 24, { size: 13 * k, color: '#b6a6ff', weight: '700' });
    }

    if (this.state === 'ready') {
      const msg = this.c.coarse ? 'برای پرتاب توپ ضربه بزنید' : 'برای پرتاب توپ کلیک کنید یا Space بزنید';
      r.text(msg, 480, this.paddle.y - 90, { size: 17 * k, color: '#c3d2ee' });
    }
  }

  drawBanner(r) {
    const m = this.message;
    const k = clamp01(m.t / m.max);
    const pop = k > 0.8 ? 1 + (k - 0.8) * 2.5 : 1;
    r.withAlpha(Math.min(1, k * 2.2), () => {
      r.textBold(m.text, 480, 320, 54 * pop, m.color, m.color);
    });
  }

  drawPause(r) {
    r.rect(0, 0, 960, 640, 'rgba(4,7,16,.72)');
    r.textBold('مکث', 480, 260, 46, '#dbe6ff', '#4cc9f0');
    if (this.c.coarse) {
      r.text('برای ادامه ضربه بزنید', 480, 320, { size: 18, color: '#9fb2d6' });
      r.text('دکمهٔ بالای صفحه = مکث', 480, 352, { size: 14, color: '#6f82a8' });
    } else {
      r.text('Esc یا P برای ادامه', 480, 320, { size: 17, color: '#9fb2d6' });
      r.text('M = بی‌صدا  •  R = شروع دوباره مرحله', 480, 350, { size: 14, color: '#6f82a8' });
    }
  }

  drawLevelComplete(r) {
    r.rect(0, 0, 960, 640, 'rgba(4,7,16,.74)');
    r.textBold('مرحله تمام شد!', 480, 210, 44, '#06d6a0', '#06d6a0');
    const b = this.bonuses;
    const rows = [
      ['پاداش پایان مرحله', b.clearBonus],
      ['پاداش جان‌های باقی‌مانده', b.lifeBonus],
      ['پاداش سرعت', b.timeBonus],
    ];
    rows.forEach(([label, v], i) => {
      const y = 270 + i * 30;
      r.text(label, 620, y, { size: 15, color: '#a9bce0', align: 'right' });
      r.text(faNum(v), 340, y, { size: 15, color: '#ffd166', align: 'left' });
    });
    r.text(`امتیاز کل: ${faNum(this.score)}`, 480, 380, { size: 22, color: '#dbe6ff', weight: '700' });
    r.text(this.c.coarse ? 'ضربه = مرحلهٔ بعد' : 'Enter = مرحله بعد   •   R = تکرار   •   Esc = منو', 480, 430, { size: 14 * (this.c.coarse ? 1.3 : 1), color: '#7f92bb' });
  }

  drawGameOver(r) {
    r.rect(0, 0, 960, 640, 'rgba(4,7,16,.8)');
    r.textBold('پایان بازی', 480, 230, 48, '#ff5d8f', '#ff5d8f');
    r.text(`امتیاز ${faNum(this.score)}`, 480, 300, { size: 26, color: '#ffd166', weight: '700' });
    r.text(`رکورد ${faNum(this.c.progress.highScore)}`, 480, 336, { size: 16, color: '#a9bce0' });
    r.text(`آجرهای شکسته: ${faNum(this.stats.bricksBroken)}   بیشترین کمبو: ${faNum(this.stats.maxCombo)}`, 480, 372, { size: 15, color: '#8ba0c9' });
    r.text(this.c.coarse ? 'ضربه = شروع دوباره' : 'Enter = دوباره   •   Esc = منو', 480, 424, { size: 14 * (this.c.coarse ? 1.3 : 1), color: '#7f92bb' });
  }

  dispose() {
    this.balls.length = 0;
    this.bricks.length = 0;
    this.powerups.length = 0;
    this.bolts.length = 0;
  }
}

function makeStarfield(rng, n) {
  const arr = [];
  for (let i = 0; i < n; i++) {
    arr.push({
      x: rng.range(0, 960),
      y: rng.range(0, 660),
      s: rng.range(0.8, 2.4),
      a: rng.range(0.15, 0.75),
      speed: rng.range(0.2, 1),
      ph: rng.range(0, TAU),
      c: rng.pick(['#ffffff', '#9fd8ff', '#ffd8a8', '#c9b6ff']),
    });
  }
  return arr;
}

/* ---- js/scenes/menu.js ---- */
// scenes/menu.js — main menu, level select, settings and help.
// Every widget is drawn on the canvas through the immediate-mode UI helper.





const VIEWS = { MAIN: 'main', LEVELS: 'levels', SETTINGS: 'settings', HELP: 'help' };

class MenuScene {
  constructor(ctx) {
    this.c = ctx;
    this.r = ctx.renderer;
    this.input = ctx.input;
    this.audio = ctx.audio;
    this.particles = ctx.particles;
    this.ui = new UI(ctx.input);
    this.view = VIEWS.MAIN;
    this.time = 0;
    this.t = 0;                       // view transition 0..1
    this.hoverSfx = false;
    this.scroll = 0;
    this.demo = makeDemo(this.rng || rand);
    this.titleY = 0;
  }

  get settings() { return this.c.settings; }

  enter() {
    this.audio.setMusicPattern('menu');
    this.audio.startMusic('menu');
  }

  update(dt) {
    this.time += dt;
    this.t = clamp(this.t + dt * 4, 0, 1);
    this.ui.k = uiScale(this.r.scale, this.c.coarse);
    this.ui.beginFrame();
    this.particles.update(dt);

    if (this.input.pressed('pause') && this.view !== VIEWS.MAIN) {
      this.audio.sfx('ui');
      this.goto(VIEWS.MAIN);
    }
  }

  goto(view) {
    if (this.view !== view) this.t = 0;
    this.view = view;
    this.scroll = 0;
  }

  draw() {
    const r = this.r;
    this.drawBackdrop(r);

    const k = this.t;
    r.withAlpha(0.25 + 0.75 * k, () => {
      switch (this.view) {
        case VIEWS.MAIN: this.drawMain(r, k); break;
        case VIEWS.LEVELS: this.drawLevels(r, k); break;
        case VIEWS.SETTINGS: this.drawSettings(r, k); break;
        case VIEWS.HELP: this.drawHelp(r, k); break;
      }
    });

    this.particles.draw(r);
    this.drawFooter(r);

    const hovering = !!this.ui.hot;
    this.r.canvas.classList.toggle('ui-cursor', hovering);
  }

  // ------------------------------------------------------------------ shared
  drawBackdrop(r) {
    const g = r.gradient(0, 0, 0, 640, [[0, '#0a1128'], [0.55, '#070c1a'], [1, '#120a20']]);
    r.rect(0, 0, 960, 640, g);

    // animated ambient bricks
    const { ctx } = r;
    ctx.save();
    for (const b of this.demo.bricks) {
      const y = ((b.y + this.time * b.v) % 760) - 60;
      ctx.globalAlpha = b.a;
      const gg = r.gradient(0, y, 0, y + b.h, [[0, b.c1], [1, b.c2]]);
      r.roundRect(b.x, y, b.w, b.h, 4, gg);
    }
    ctx.restore();

    // glow blobs
    ctx.save();
    ctx.globalAlpha = 0.16;
    for (const [cx, cy, rad, col, sp] of this.demo.blobs) {
      const x = cx + Math.sin(this.time * sp) * 60;
      const y = cy + Math.cos(this.time * sp * 0.8) * 40;
      const rg = r.ctx.createRadialGradient(x, y, 0, x, y, rad);
      rg.addColorStop(0, col);
      rg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(x, y, rad, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  drawFooter(r) {
    const hint = this.c.coarse && innerWidth < innerHeight
      ? 'نمایش افقیِ خودکار فعال است 🔄'
      : 'ساخته‌شده با Canvas خالص — بدون فایل خارجی';
    r.text(hint, 480, 622, { size: 12 * this.ui.k, color: '#4e5f84' });
    // The M hotkey is handled globally in core/game.js so it never double-fires.
    const m = this.settings.muted;
    r.text(m ? '🔇 بی‌صدا (M)' : '🔊 صدا (M)', 928, 622, { size: 12, color: '#4e5f84', align: 'right' });
  }

  header(r, title, sub) {
    r.textBold(title, 480, 62, 34, '#dbe6ff', '#4cc9f0');
    if (sub) r.text(sub, 480, 92, { size: 14, color: '#7f92bb' });
  }

  // ------------------------------------------------------------------ main
  drawMain(r, k) {
    const y0 = 120 + (1 - k) * 24;

    // title
    const bounce = Math.sin(this.time * 1.6) * 5;
    r.textBold('آجرشکن', 480, y0 + bounce, 84, '#ffd166', '#ffb454');
    r.text('نسخه پیشرفته — فیزیک پیوسته، پاور‌آپ، ویرایشگر مرحله', 480, y0 + 48, { size: 15, color: '#8ba0c9' });

    const hs = this.c.progress.highScore;
    if (hs > 0) r.text(`رکورد شما: ${faNum(hs)}`, 480, y0 + 74, { size: 15, color: '#4cc9f0', weight: '700' });

    const uk = this.ui.k;
    const bw = 300 * Math.min(uk, 1.35), bh = 54 * uk, bx = 480 - bw / 2;
    let by = y0 + 108 * uk;
    const gap = 16 * uk;

    if (this.ui.button(r, 'start', bx, by, bw, bh, '▶  شروع بازی', { variant: 'primary', size: 22 * uk, hint: 'Enter' })) {
      this.audio.sfx('select');
      this.c.events.emit('startRun', { levelId: 1 });
      return;
    }
    by += bh + gap + 16 * uk;
    if (this.ui.button(r, 'levels', bx, by, bw, bh, 'انتخاب مرحله', { size: 20 * uk })) {
      this.audio.sfx('ui'); this.goto(VIEWS.LEVELS); return;
    }
    by += bh + gap;
    if (this.ui.button(r, 'editor', bx, by, bw, bh, 'ویرایشگر مرحله', { size: 20 * uk })) {
      this.audio.sfx('ui'); this.c.events.emit('openEditor'); return;
    }
    by += bh + gap;

    // two half-width buttons
    const hw = (bw - gap) / 2;
    if (this.ui.button(r, 'settings', bx, by, hw, (bh - 8) * uk, 'تنظیمات', { variant: 'ghost', size: 17 * uk })) {
      this.audio.sfx('ui'); this.goto(VIEWS.SETTINGS); return;
    }
    if (this.ui.button(r, 'help', bx + hw + gap, by, hw, (bh - 8) * uk, 'راهنما', { variant: 'ghost', size: 17 * uk })) {
      this.audio.sfx('ui'); this.goto(VIEWS.HELP); return;
    }
  }

  // ------------------------------------------------------------------ levels
  drawLevels(r, k) {
    this.header(r, 'انتخاب مرحله', 'مرحله‌ها با پیشرفت شما باز می‌شوند');
    const cols = 5, cw = 168, ch = 104, gap = 14;
    const totalW = cols * cw + (cols - 1) * gap;
    const x0 = 480 - totalW / 2, y0 = 130;

    const prog = this.c.progress;
    const custom = prog.customLevels || [];
    const totalRows = Math.ceil((LEVEL_COUNT + custom.length) / cols);
    const gridH = Math.min(392, totalRows * (ch + gap));
    const maxScroll = Math.max(0, totalRows * (ch + gap) - gridH);

    this.scroll = clamp(this.scroll + this.input.wheel * 40, 0, maxScroll);
    // touch drag scrolling (phones have no wheel)
    const p2 = this.input.pointer;
    if (p2.down && p2.moved) {
      if (this.scrollDrag == null) this.scrollDrag = { y: p2.y, moved: 0 };
    }
    if (this.scrollDrag && p2.down) {
      const dy = p2.y - this.scrollDrag.y;
      this.scrollDrag.y = p2.y;
      this.scrollDrag.moved += Math.abs(dy);
      this.scroll = clamp(this.scroll - dy, 0, maxScroll);
      if (this.scrollDrag.moved > 12) this.suppressClick = true;
    }
    if (!p2.down) { this.scrollDrag = null; }
    if (!p2.down && !p2.pressed) this.suppressClick = false;

    const items = [];
    for (let i = 1; i <= LEVEL_COUNT; i++) items.push({ id: i, def: LEVELS[i - 1], custom: false });
    custom.forEach((c, i) => items.push({ id: 'c' + i, def: { name: c.name || 'دلخواه', rows: c.rows }, custom: true }));

    this.drawLevelGrid(r, items, { x0, y0, cw, ch, gap, cols, gridH, totalW });

    const clickedIdx = this.hitLevelCard(r, items, { x0, y0, cw, ch, gap, cols, gridH });
    if (clickedIdx >= 0) {
      const item = items[clickedIdx];
      const unlocked = item.custom || item.id <= prog.unlocked;
      if (unlocked) {
        this.audio.sfx('select');
        this.c.events.emit('startRun', { levelId: item.id });
        return;
      }
      this.audio.sfx('bad');
    }

    const uk = this.ui.k;
    const bw = 200 * Math.min(uk, 1.3);
    const byy = 640 - 74 * Math.min(uk, 1.3);
    if (this.ui.button(r, 'newlevel', 480 - bw - 10, byy, bw, 44 * Math.min(uk, 1.3), '+ مرحله جدید', { size: 17 * Math.min(uk, 1.3) })) {
      this.audio.sfx('ui'); this.c.events.emit('openEditor'); return;
    }
    if (this.ui.button(r, 'back', 480 + 10, byy, bw, 44 * Math.min(uk, 1.3), 'بازگشت', { variant: 'ghost', size: 17 * Math.min(uk, 1.3) })) {
      this.audio.sfx('ui'); this.goto(VIEWS.MAIN); return;
    }
  }

  /** Draws the level cards and reports hover state. */
  drawLevelGrid(r, items, g) {
    const prog = this.c.progress;
    const p = this.input.pointer;
    const { x0, y0, cw, ch, gap, cols, gridH, totalW } = g;

    r.withClip(x0, y0, totalW, gridH, () => {
      for (let idx = 0; idx < items.length; idx++) {
        const item = items[idx];
        const col = idx % cols, row = (idx / cols) | 0;
        const cx = x0 + col * (cw + gap);
        const cy = y0 + row * (ch + gap) - this.scroll;
        if (cy + ch < y0 || cy > y0 + gridH) continue;

        const unlocked = item.custom || item.id <= prog.unlocked;
        const best = prog.bestByLevel?.[item.id] ?? 0;
        const inside = p.x >= cx && p.x <= cx + cw && p.y >= cy && p.y <= cy + ch;
        const hov = inside && unlocked;
        if (inside) this.ui.hot = 'card.' + idx;

        const bg = hov
          ? r.gradient(0, cy, 0, cy + ch, [[0, '#233355'], [1, '#152036']])
          : r.gradient(0, cy, 0, cy + ch, [[0, '#161f36'], [1, '#0e1526']]);
        r.roundRect(cx, cy, cw, ch, 12, bg, hov ? '#4cc9f0' : unlocked ? '#26375c' : '#1b2338', hov ? 1.8 : 1);

        if (!unlocked) {
          r.text('🔒', cx + cw / 2, cy + ch / 2 - 10, { size: 26, color: '#5d6d92' });
          r.text(`مرحله ${faNum(item.id)}`, cx + cw / 2, cy + ch - 20, { size: 12, color: '#4e5f84' });
          continue;
        }

        r.text(item.custom ? '⭐' : faNum(item.id), cx + 18, cy + 26, {
          size: 24, color: item.custom ? '#ffd166' : '#4cc9f0', align: 'left', weight: '700',
        });
        r.text(item.def.name, cx + cw - 14, cy + 26, { size: 15, color: '#dbe6ff', align: 'right', weight: '700' });
        r.text(best ? `بهترین: ${faNum(best)}` : 'بازی نشده', cx + cw - 14, cy + 52, { size: 12, color: '#7f92bb', align: 'right' });

        const rows = item.def.rows;
        if (rows) {
          const pw = 5.2, ph = 3.2, pg = 0.8;
          r.ctx.save();
          for (let rr2 = 0; rr2 < Math.min(rows.length, 8); rr2++) {
            for (let cc = 0; cc < 16; cc++) {
              const code = rows[rr2]?.[cc];
              if (!code || code === '.') continue;
              r.ctx.globalAlpha = 0.9;
              r.ctx.fillStyle = BRICK_DEFS[code]?.bottom ?? '#666';
              r.ctx.fillRect(cx + 14 + cc * (pw + pg), cy + 64 + rr2 * (ph + pg), pw, ph);
            }
          }
          r.ctx.restore();
        }
      }
    });

    if (totalW > 0 && items.length > cols * Math.floor(gridH / (ch + gap))) {
      const maxScroll = Math.max(1, Math.ceil(items.length / cols) * (ch + gap) - gridH);
      const k = this.scroll / maxScroll;
      const barH = Math.max(30, gridH * (gridH / (Math.ceil(items.length / cols) * (ch + gap))));
      r.roundRect(x0 + totalW + 6, y0 + k * (gridH - barH), 5, barH, 3, '#2c4270');
    }
  }

  /** @returns index of a clicked card, or -1 */
  hitLevelCard(r, items, g) {
    const p = this.input.pointer;
    if (!p.pressed || this.suppressClick) return -1;
    const { x0, y0, cw, ch, gap, cols, gridH } = g;
    for (let idx = 0; idx < items.length; idx++) {
      const col = idx % cols, row = (idx / cols) | 0;
      const cx = x0 + col * (cw + gap);
      const cy = y0 + row * (ch + gap) - this.scroll;
      if (cy + ch < y0 || cy > y0 + gridH) continue;
      if (p.x >= cx && p.x <= cx + cw && p.y >= cy && p.y <= cy + ch) return idx;
    }
    return -1;
  }

  // ------------------------------------------------------------------ settings
  drawSettings(r, k) {
    this.header(r, 'تنظیمات', 'تغییرات فوراً ذخیره می‌شوند');
    const s = this.settings;
    const uk = this.ui.k;
    const x = 300, w = 360;
    let y = 170 * uk;

    s.sfx = this.ui.slider(r, 'sfx', x, y, w, s.sfx, { label: 'صدای افکت', format: (v) => faNum(Math.round(v * 100)) + '٪' });
    y += 58 * uk;
    s.music = this.ui.slider(r, 'music', x, y, w, s.music, { label: 'موسیقی', format: (v) => faNum(Math.round(v * 100)) + '٪' });
    y += 58 * uk;

    s.muted = this.ui.toggle(r, 'muted', x, y, s.muted, { label: 'بی‌صدا کردن همه' });
    y += 48 * uk;
    s.screenShake = this.ui.toggle(r, 'shake', x, y, s.screenShake, { label: 'لرزش صفحه' });
    y += 48 * uk;

    r.text('کنترل راکت', x - 12, y + 14 * uk, { size: 14 * uk, color: '#a9bce0', align: 'right' });
    const modes = [['both', 'هر دو'], ['mouse', 'ماوس'], ['keys', 'کیبورد']];
    const mw = 96 * uk;
    modes.forEach(([id, label], i) => {
      const bx = x + i * (mw + 8 * uk);
      const active = s.control === id;
      if (this.ui.button(r, 'ctl-' + id, bx, y, mw, 34 * uk, label, { variant: active ? 'primary' : 'ghost', size: 14 * uk })) {
        s.control = id;
        this.audio.sfx('ui');
      }
    });
    y += 60 * uk;

    r.text('با «هر دو» می‌توانید هم‌زمان با ماوس و جهت‌نما بازی کنید.', x + w, y + 12, { size: 12 * uk, color: '#6f82a8', align: 'right' });
    y += 52 * uk;

    if (this.ui.button(r, 'reset-progress', 300, y, 220 * uk, 42 * uk, 'پاک کردن رکوردها', { variant: 'danger', size: 16 * uk })) {
      this.c.progress.highScore = 0;
      this.c.progress.unlocked = 1;
      this.c.progress.bestByLevel = {};
      this.c.persistProgress();
      this.audio.sfx('bad');
    }
    if (this.ui.button(r, 'back2', 300 + 240 * uk, y, 120 * uk, 42 * uk, 'بازگشت', { variant: 'ghost', size: 16 * uk })) {
      this.audio.sfx('ui'); this.goto(VIEWS.MAIN); return;
    }

    saveSettings(s);
    this.audio.setSfxVolume(s.sfx);
    this.audio.setMusicVolume(s.music);
    this.audio.setMuted(s.muted);
    this.r.shakeScale = s.screenShake ? 1 : 0;
  }

  // ------------------------------------------------------------------ help
  drawHelp(r, k) {
    this.header(r, 'راهنما', 'چطور بازی کنیم');

    this.ui.panel(r, 90, 130, 380, 250, {});
    r.text('کنترل‌ها', 280, 160, { size: 18, color: '#ffd166', weight: '700' });
    const controls = [
      ['ماوس / لمس', 'حرکت راکت'],
      ['← →  یا  A D', 'حرکت راکت با کیبورد'],
      ['Space / کلیک', 'پرتاب توپ و شلیک لیزر'],
      ['Esc یا P', 'مکث'],
      ['M', 'بی‌صدا'],
      ['F', 'تمام‌صفحه'],
      ['R', 'شروع دوباره مرحله'],
    ];
    controls.forEach(([key, desc], i) => {
      const y = 196 + i * 25;
      r.roundRect(430, y - 11, 28, 22, 5, '#1b2742', '#2c4270', 1);
      r.text(key.split(' ')[0], 444, y, { size: 11, color: '#c3d2ee' });
      r.text(desc, 420, y, { size: 13, color: '#a9bce0', align: 'right' });
    });

    this.ui.panel(r, 490, 130, 380, 250, {});
    r.text('انواع آجر', 680, 160, { size: 18, color: '#ffd166', weight: '700' });
    const kinds = [
      ['1', 'یک ضربه — ۵۰ امتیاز'],
      ['2', 'دو ضربه — ۱۱۰ امتیاز'],
      ['3', 'سه ضربه — ۱۹۰ امتیاز'],
      ['E', 'منفجره — زنجیره‌ای می‌ترکد'],
      ['X', 'فولاد — با توپ شکسته نمی‌شود، فقط لیزر'],
    ];
    kinds.forEach(([code, desc], i) => {
      const y = 198 + i * 30;
      const def = BRICK_DEFS[code];
      r.roundRect(828, y - 11, 30, 20, 4, r.gradient(0, y - 11, 0, y + 9, [[0, def.top], [1, def.bottom]]));
      r.text(desc, 818, y, { size: 13, color: '#a9bce0', align: 'right' });
    });

    this.ui.panel(r, 90, 396, 780, 130, {});
    r.text('پاور‌آپ‌ها', 480, 422, { size: 18, color: '#ffd166', weight: '700' });
    const keys = Object.keys(POWERUPS);
    const pw = 780 / keys.length;
    keys.forEach((key, i) => {
      const def = POWERUPS[key];
      const cx = 90 + pw * i + pw / 2;
      r.circle(cx, 462, 15, def.color + '33', def.color, 1.5);
      drawPowerIcon(r.ctx, def.icon, cx, 462, def.color);
      r.text(def.label, cx, 492, { size: 11, color: '#c3d2ee' });
      r.text(def.desc, cx, 508, { size: 9, color: '#6f82a8' });
    });

    if (this.ui.button(r, 'back3', 380, 552, 200, 44, 'بازگشت', { variant: 'ghost', size: 17 })) {
      this.audio.sfx('ui'); this.goto(VIEWS.MAIN);
    }
  }
}

function makeDemo(rng) {
  const bricks = [];
  const palette = [
    ['#ffb454', '#f0762a'], ['#7ad7ff', '#2b8fd0'], ['#d7a6ff', '#8a4fd6'], ['#ff8a7a', '#e23b3b'],
  ];
  for (let i = 0; i < 26; i++) {
    const [c1, c2] = rng.pick(palette);
    bricks.push({ x: rng.range(-20, 940), y: rng.range(-60, 700), w: rng.range(34, 74), h: rng.range(16, 26), v: rng.range(6, 26), a: rng.range(0.05, 0.16), c1, c2 });
  }
  const blobs = [
    [200, 180, 260, '#4cc9f0', 0.25],
    [780, 420, 300, '#ff5d8f', 0.18],
    [520, 620, 240, '#8a4fd6', 0.3],
  ];
  return { bricks, blobs };
}

/* ---- js/scenes/editor.js ---- */
// scenes/editor.js — click-to-paint level editor with import/export codes.
// Levels are plain text: 16 chars per row, rows separated by "/".



const ED_COLS = 16;
const ED_ROWS = 12;
const ED_CELL = 40;
const ED_X = 36;
const ED_Y = 132;
const BRUSHES = ['1', '2', '3', 'E', 'X', '.'];
const BRUSH_LABEL = { '1': 'عادی', '2': 'مقاوم', '3': 'سنگین', 'E': 'منفجره', 'X': 'فولاد', '.': 'پاک‌کن' };

class EditorScene {
  constructor(ctx, opts = {}) {
    this.c = ctx;
    this.r = ctx.renderer;
    this.input = ctx.input;
    this.audio = ctx.audio;
    this.particles = ctx.particles;
    this.ui = new UI(ctx.input);

    this.rows = opts.rows ? opts.rows.slice(0, ED_ROWS).map((r) => r.padEnd(ED_COLS, '.').slice(0, ED_COLS)) : emptyGrid();
    while (this.rows.length < ED_ROWS) this.rows.push('.'.repeat(ED_COLS));
    this.name = opts.name || '';
    this.brush = '1';
    this.painting = false;
    this.paintValue = null;
    this.time = 0;
    this.code = '';
    this.codeActive = false;
    this.toast = null;
    this.hoverCell = null;
    this.savedIndex = opts.index ?? -1;
  }

  enter() { this.audio.setMusicPattern('menu'); }

  get codeString() { return this.rows.map((r) => r.replace(/\.+$/, '')).join('/') + '/'; }

  setCode(str) {
    const raw = str.trim().replace(/\s+/g, '').toUpperCase();
    const parts = raw.split(/[\/,\n]/).filter((s) => s.length > 0);
    const rows = parts.map((p) => (p + '.'.repeat(ED_COLS)).slice(0, ED_COLS)).slice(0, ED_ROWS);
    while (rows.length < ED_ROWS) rows.push('.'.repeat(ED_COLS));
    this.rows = rows;
  }

  notify(text, color = '#06d6a0') {
    this.toast = { text, t: 2.2, color };
  }

  update(dt) {
    this.time += dt;
    this.ui.beginFrame();
    this.particles.update(dt);
    if (this.toast) {
      this.toast.t -= dt;
      if (this.toast.t <= 0) this.toast = null;
    }

    // number keys pick a brush (disabled while typing a level code)
    if (!this.codeActive) {
      for (let i = 0; i < BRUSHES.length; i++) {
        if (this.input.pressed('brush' + (i + 1))) {
          this.brush = BRUSHES[i];
          this.audio.sfx('ui');
        }
      }
    }
    if (this.input.pressed('pause')) {
      this.audio.sfx('ui');
      this.c.events.emit('exitToMenu');
    }

    if (this.codeActive) this.code = this.ui.readTyping(this.code);
  }

  // ------------------------------------------------------------------ grid
  cellAt(px, py) {
    const c = Math.floor((px - ED_X) / ED_CELL);
    const r = Math.floor((py - ED_Y) / ED_CELL);
    if (c < 0 || c >= ED_COLS || r < 0 || r >= ED_ROWS) return null;
    return { c, r };
  }

  paint(cell, value) {
    const row = this.rows[cell.r].split('');
    if (row[cell.c] === value) return;
    row[cell.c] = value;
    this.rows[cell.r] = row.join('');
    this.audio.sfx(value === '.' ? 'ui' : 'brick', 2);
    const x = ED_X + cell.c * ED_CELL + ED_CELL / 2;
    const y = ED_Y + cell.r * ED_CELL + ED_CELL / 2;
    if (value === '.') this.particles.smoke(x, y, '#6f82a8', 4);
    else this.particles.spark(x, y, BRICK_DEFS[value].top, 5, 140, 0.3);
  }

  handleGridInput() {
    const p = this.input.pointer;
    const cell = this.cellAt(p.x, p.y);
    this.hoverCell = cell;

    if (p.pressed && cell) {
      this.painting = true;
      this.paintValue = this.rows[cell.r][cell.c] === this.brush ? '.' : this.brush;
      this.paint(cell, this.paintValue);
    }
    if (this.painting && p.down && cell) this.paint(cell, this.paintValue);
    if (!p.down) this.painting = false;
  }

  // ------------------------------------------------------------------ draw
  draw() {
    const r = this.r;
    r.rect(0, 0, 960, 640, r.gradient(0, 0, 0, 640, [[0, '#0a1128'], [1, '#0b0716']]));

    r.textBold('ویرایشگر مرحله', 480, 46, 30, '#dbe6ff', '#4cc9f0');
    r.text('کلیک و کشیدن برای گذاشتن آجر  •  کلیدهای ۱ تا ۶ برای انتخاب قلم', 480, 76, { size: 12, color: '#7f92bb' });

    this.handleGridInput();
    this.drawGrid(r);
    this.drawBrushes(r);
    this.drawSidePanel(r);
    this.particles.draw(r);

    if (this.toast) {
      const a = clamp(this.toast.t / 0.5, 0, 1);
      r.withAlpha(a, () => {
        r.roundRect(330, 588, 300, 36, 10, 'rgba(10,16,32,.95)', this.toast.color, 1.5);
        r.text(this.toast.text, 480, 606, { size: 15, color: this.toast.color, weight: '700' });
      });
    }

    this.r.canvas.classList.toggle('ui-cursor', !!this.ui.hot || !this.hoverCell);
  }

  drawGrid(r) {
    const { ctx } = r;
    const w = ED_COLS * ED_CELL, h = ED_ROWS * ED_CELL;
    r.roundRect(ED_X - 8, ED_Y - 8, w + 16, h + 16, 12, 'rgba(8,13,28,.85)', '#22345c', 1);

    // checker
    for (let rr = 0; rr < ED_ROWS; rr++) {
      for (let cc = 0; cc < ED_COLS; cc++) {
        const x = ED_X + cc * ED_CELL, y = ED_Y + rr * ED_CELL;
        r.rect(x, y, ED_CELL, ED_CELL, (cc + rr) % 2 ? 'rgba(255,255,255,.018)' : 'rgba(255,255,255,.038)');
      }
    }

    // bricks
    for (let rr = 0; rr < ED_ROWS; rr++) {
      for (let cc = 0; cc < ED_COLS; cc++) {
        const code = this.rows[rr][cc];
        if (code === '.') continue;
        const def = BRICK_DEFS[code];
        const x = ED_X + cc * ED_CELL + 2, y = ED_Y + rr * ED_CELL + 3;
        r.roundRect(x, y, ED_CELL - 4, ED_CELL - 6, 5, r.gradient(0, y, 0, y + ED_CELL, [[0, def.top], [1, def.bottom]]), 'rgba(6,10,24,.5)', 1);
      }
    }

    // grid lines
    ctx.save();
    ctx.globalAlpha = 0.25;
    ctx.strokeStyle = '#22345c';
    ctx.lineWidth = 1;
    for (let cc = 0; cc <= ED_COLS; cc++) {
      ctx.beginPath(); ctx.moveTo(ED_X + cc * ED_CELL, ED_Y); ctx.lineTo(ED_X + cc * ED_CELL, ED_Y + h); ctx.stroke();
    }
    for (let rr = 0; rr <= ED_ROWS; rr++) {
      ctx.beginPath(); ctx.moveTo(ED_X, ED_Y + rr * ED_CELL); ctx.lineTo(ED_X + w, ED_Y + rr * ED_CELL); ctx.stroke();
    }
    ctx.restore();

    // hover highlight + ghost brick
    if (this.hoverCell) {
      const { c, r: rr } = this.hoverCell;
      const x = ED_X + c * ED_CELL, y = ED_Y + rr * ED_CELL;
      const def = BRICK_DEFS[this.brush];
      if (this.brush !== '.') {
        r.withAlpha(0.45, () => r.roundRect(x + 2, y + 3, ED_CELL - 4, ED_CELL - 6, 5, def.bottom));
      }
      r.roundRect(x + 1, y + 1, ED_CELL - 2, ED_CELL - 2, 5, null, '#ffd166', 2);
    }

    // paddle preview line
    r.withAlpha(0.5, () => {
      r.roundRect(480 - 58, ED_Y + h + 14, 116, 8, 4, '#4cc9f0');
    });
  }

  drawBrushes(r) {
    const y = 92;
    BRUSHES.forEach((code, i) => {
      const x = ED_X + i * 72;
      const active = this.brush === code;
      const label = BRUSH_LABEL[code];
      const bg = active ? '#233355' : 'rgba(20,30,54,.7)';
      r.roundRect(x, y, 68, 40, 9, bg, active ? '#ffd166' : '#26375c', active ? 2 : 1);
      if (code === '.') {
        r.ctx.save();
        r.ctx.strokeStyle = '#8ba0c9';
        r.ctx.lineWidth = 2;
        r.ctx.beginPath(); r.ctx.moveTo(x + 14, y + 14); r.ctx.lineTo(x + 26, y + 26);
        r.ctx.moveTo(x + 26, y + 14); r.ctx.lineTo(x + 14, y + 26); r.ctx.stroke();
        r.ctx.restore();
      } else {
        const def = BRICK_DEFS[code];
        r.roundRect(x + 10, y + 12, 20, 14, 3, r.gradient(0, y + 12, 0, y + 26, [[0, def.top], [1, def.bottom]]));
      }
      r.text(label, x + 36, y + 20, { size: 11, color: '#c3d2ee', align: 'left' });
      r.text(faNum(i + 1), x + 60, y + 32, { size: 9, color: '#6f82a8', align: 'left' });
      if (this.ui._hovered(x, y, 68, 40)) {
        this.ui.hot = 'brush.' + code;
        if (this.input.pointer.pressed) { this.brush = code; this.audio.sfx('ui'); }
      }
    });
  }

  drawSidePanel(r) {
    const px = ED_X + ED_COLS * ED_CELL + 24;
    const pw = 960 - px - 20;
    this.ui.panel(r, px, ED_Y - 8, pw, ED_ROWS * ED_CELL + 16, {});

    let y = ED_Y + 18;
    r.text('نام مرحله', px + pw / 2, y, { size: 13, color: '#8ba0c9' });
    y += 16;
    this.ui.textInput(r, 'name', px + 14, y, pw - 28, this.name, { active: true, placeholder: 'مثلاً: دیوار آتش' });
    y += 52;

    const bw = pw - 28;
    const stats = this.gridStats();
    r.text(`آجرها: ${faNum(stats.breakable)}   فولاد: ${faNum(stats.steel)}   منفجره: ${faNum(stats.bombs)}`, px + pw / 2, y, { size: 12, color: '#8ba0c9' });
    y += 26;

    if (this.ui.button(r, 'clear', px + 14, y, bw, 36, 'پاک کردن همه', { variant: 'ghost', size: 14 })) {
      this.rows = emptyGrid();
      this.audio.sfx('bad');
      this.notify('صفحه پاک شد', '#ff5d8f');
    }
    y += 46;

    r.text('کد مرحله (برای اشتراک‌گذاری)', px + pw / 2, y, { size: 13, color: '#8ba0c9' });
    y += 16;
    this.ui.textInput(r, 'code', px + 14, y, bw, this.code, { active: this.codeActive, placeholder: 'کد را اینجا بنویسید' });
    if (this.ui._hovered(px + 14, y, bw, 34) && this.input.pointer.pressed) this.codeActive = true;
    else if (this.input.pointer.pressed && !this.ui._hovered(px + 14, y, bw, 34)) this.codeActive = false;
    y += 44;

    if (this.ui.button(r, 'apply', px + 14, y, bw, 34, 'اعمال کد', { size: 14 })) {
      if (this.code) {
        this.setCode(this.code);
        this.audio.sfx('select');
        this.notify('کد اعمال شد');
      }
    }
    y += 44;
    if (this.ui.button(r, 'copy', px + 14, y, bw, 34, 'کپی کد', { variant: 'ghost', size: 14 })) {
      this.code = this.codeString;
      copyToClipboard(this.code);
      this.audio.sfx('ui');
      this.notify('کد کپی شد');
    }
    y += 44;
    if (this.ui.button(r, 'test', px + 14, y, bw, 40, '▶ آزمایش مرحله', { variant: 'primary', size: 15 })) {
      this.audio.sfx('select');
      this.c.events.emit('testLevel', { rows: this.rows.filter((row, i) => row.includes('1') || row.includes('2') || row.includes('3') || row.includes('E') || row.includes('X')), name: this.name });
    }
    y += 50;
    if (this.ui.button(r, 'save', px + 14, y, bw, 40, '💾 ذخیره', { size: 15 })) this.save();
    y += 50;
    if (this.ui.button(r, 'back', px + 14, y, bw, 36, 'بازگشت به منو', { variant: 'ghost', size: 14 })) {
      this.audio.sfx('ui');
      this.c.events.emit('exitToMenu');
    }
  }

  gridStats() {
    let breakable = 0, steel = 0, bombs = 0;
    for (const row of this.rows) {
      for (const ch of row) {
        if (ch === 'X') steel++;
        else if (ch === 'E') { bombs++; breakable++; }
        else if (ch !== '.') breakable++;
      }
    }
    return { breakable, steel, bombs };
  }

  save() {
    const rows = this.rows.filter((row) => /[123EX]/.test(row));
    if (!validateRows(rows)) {
      this.audio.sfx('bad');
      this.notify('مرحله خالی است!', '#ff5d8f');
      return;
    }
    const list = this.c.progress.customLevels || [];
    const entry = { name: this.name.trim() || 'مرحله دلخواه', rows, createdAt: Date.now() };
    if (this.savedIndex >= 0 && list[this.savedIndex]) list[this.savedIndex] = entry;
    else { list.push(entry); this.savedIndex = list.length - 1; }
    this.c.progress.customLevels = list;
    this.c.persistProgress();
    this.audio.sfx('powerup');
    this.notify('ذخیره شد — در «انتخاب مرحله» هست');
  }
}

function emptyGrid() {
  return Array.from({ length: ED_ROWS }, () => '.'.repeat(ED_COLS));
}

async function copyToClipboard(text) {
  try { await navigator.clipboard.writeText(text); } catch { /* ignore */ }
}

/* ---- js/core/game.js ---- */
// core/game.js — application shell: owns the loop, the scene stack and the
// shared context (renderer / input / audio / particles / progress).










const VW = 960;
const VH = 640;

class Game {
  constructor(canvas) {
    this.canvas = canvas;
    this.renderer = new Renderer(canvas, VW, VH);
    // Touch devices get fullscreen fake-landscape on portrait screens.
    this.coarse = typeof matchMedia === 'function' && matchMedia('(pointer: coarse)').matches;
    this.renderer.coarse = this.coarse;
    this.renderer.resize();
    this.input = new Input(canvas, VW, VH, this.renderer);
    this.audio = new AudioBus();
    this.particles = new Particles(1800);
    this.floats = new FloatTexts(120);
    this.events = new Emitter();

    this.settings = loadSettings();
    this.progress = loadProgress();
    this.progress.customLevels = loadCustomLevels();

    this.audio.setSfxVolume(this.settings.sfx);
    this.audio.setMusicVolume(this.settings.music);
    this.audio.setMuted(this.settings.muted);
    this.renderer.shakeScale = this.settings.screenShake ? 1 : 0;

    this.bindActions();
    this.bindEvents();
    this.bindWindow();

    this.scene = null;
    this._enterScenes = false;   // scenes only "enter" once the loop has started
    this.fps = 60;
    this._fpsAcc = 0;
    this._fpsFrames = 0;
    this.lastT = 0;
    this.started = false;

    this.setScene(new MenuScene(this));
  }

  // ------------------------------------------------------------------ wiring
  bindActions() {
    bindDefaultActions(this.input);
  }

  bindEvents() {
    const e = this.events;
    e.on('startRun', ({ levelId }) => {
      this.progress.sessionScore = 0;
      this.startLevel(levelId);
    });
    e.on('nextLevel', () => {
      const next = this.scene.levelId;
      const id = typeof next === 'string' ? LEVELS[0].id : (next % LEVELS.length) + 1;
      this.startLevel(id);
    });
    e.on('restartLevel', () => this.startLevel(this.scene.levelId));
    e.on('restartRun', () => {
      this.progress.sessionScore = 0;
      this.startLevel(this.lastRunLevel ?? 1);
    });
    e.on('exitToMenu', () => {
      this.progress.sessionScore = 0;
      this.setScene(new MenuScene(this));
    });
    e.on('openEditor', () => this.setScene(new EditorScene(this)));
    e.on('testLevel', ({ rows, name }) => {
      if (!validateRows(rows)) return;
      this.progress.sessionScore = 0;
      const scene = new GameScene(this, { levelId: 0, name, customRows: rows });
      this.lastRunLevel = null;
      this.setScene(scene);
    });

    e.on('levelComplete', ({ score, levelId }) => {
      const p = this.progress;
      p.sessionScore = score;
      p.highScore = Math.max(p.highScore, score);
      p.bestByLevel = p.bestByLevel || {};
      if (typeof levelId === 'number') {
        p.bestByLevel[levelId] = Math.max(p.bestByLevel[levelId] || 0, score);
        p.unlocked = Math.max(p.unlocked, Math.min(LEVELS.length, levelId + 1));
      }
      this.persistProgress();
    });

    e.on('gameOver', ({ score }) => {
      const p = this.progress;
      p.plays = (p.plays || 0) + 1;
      p.highScore = Math.max(p.highScore, score);
      p.sessionScore = 0;
      this.persistProgress();
    });
  }

  bindWindow() {
    // Audio needs a user gesture; hook the first one.
    const kick = () => {
      this.audio.resume();
      if (this.scene instanceof MenuScene) this.scene.enter();
      this.tryLandscapeFullscreen();
      window.removeEventListener('pointerdown', kick);
      window.removeEventListener('keydown', kick);
    };
    window.addEventListener('pointerdown', kick);
    window.addEventListener('keydown', kick);

    document.addEventListener('visibilitychange', () => {
      if (document.hidden && this.scene instanceof GameScene && this.scene.state === 'playing') {
        this.scene.togglePause();
      }
    });
  }

  /** On touch devices: go fullscreen and lock landscape where the platform allows. */
  tryLandscapeFullscreen() {
    if (!this.coarse) return;
    try {
      const el = document.documentElement;
      const fs = el.requestFullscreen?.() || Promise.resolve();
      Promise.resolve(fs)
        .then(() => screen.orientation?.lock?.('landscape'))
        .catch(() => { /* iOS & friends: the rotated renderer covers us */ });
    } catch { /* rotated renderer covers us */ }
  }

  persistProgress() {
    const custom = this.progress.customLevels || [];
    saveProgress(this.progress);
    saveCustomLevels(custom);
  }

  startLevel(levelId) {
    this.lastRunLevel = levelId;
    this.setScene(new GameScene(this, { levelId }));
  }

  setScene(scene) {
    if (this.scene?.dispose) this.scene.dispose();
    this.particles.clear();
    this.floats.clear();
    this.scene = scene;
    this.canvas.classList.remove('ui-cursor');
    if (scene.enter && this._enterScenes) scene.enter();
    // Music itself is started by the scene's enter() — which only ever runs
    // after the first user gesture, so the AudioContext is never created early.
    if (scene instanceof GameScene) this.audio.setMusicPattern('play');
  }

  // ------------------------------------------------------------------ loop
  start() {
    if (this.started) return;
    this.started = true;
    this._enterScenes = true;
    this.lastT = performance.now();
    const frame = (t) => {
      requestAnimationFrame(frame);
      let dt = (t - this.lastT) / 1000;
      this.lastT = t;
      if (dt > 0.05) dt = 0.05;     // clamp after tab switches / hiccups
      this.tick(dt);
    };
    requestAnimationFrame(frame);
  }

  tick(dt) {
    // fps meter
    this._fpsAcc += dt;
    this._fpsFrames++;
    if (this._fpsAcc >= 0.5) {
      this.fps = Math.round(this._fpsFrames / this._fpsAcc);
      this._fpsAcc = 0;
      this._fpsFrames = 0;
    }

    this.handleGlobalKeys();
    this.renderer.begin(dt);
    this.scene.update(dt);
    this.scene.draw();
    this.drawOverlayMeta();
    this.renderer.end();
    this.input.endFrame();
  }

  handleGlobalKeys() {
    const i = this.input;
    if (i.pressed('appMute')) {
      this.settings.muted = !this.settings.muted;
      this.audio.setMuted(this.settings.muted);
      saveSettings(this.settings);
      if (!this.settings.muted) this.audio.sfx('ui');
    }
    if (i.pressed('fullscreen')) {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
      else document.exitFullscreen?.().catch(() => {});
    }
  }

  drawOverlayMeta() {
    const r = this.renderer;
    r.ctx.save();
    r.ctx.globalAlpha = 0.55;
    r.text(`${this.fps} fps`, 24, 626, { size: 11, color: '#5f7199', align: 'left' });
    r.ctx.restore();
  }
}

/* ---- js/main.js ---- */
// main.js — bootstrap.

const canvas = document.getElementById('game');
const game = new Game(canvas);

// Expose for debugging from the console.
window.__breakout = game;

// The viewport must be measured after layout, so start on the next frame.
requestAnimationFrame(() => {
  game.renderer.resize();
  game.start();
  document.getElementById('boot')?.remove();
});


</script>
